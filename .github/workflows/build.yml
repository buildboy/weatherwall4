name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Fix 1: Ensure the Gradle wrapper has permission to run on Linux
      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      # Fix 2: Use the wrapper (./gradlew) instead of the global `gradle` command
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Fix 3: Use a wildcard wildcard path to reliably find the APK regardless of folder name
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeatherWall-apk
          path: "**/build/outputs/apk/debug/*.apk"
